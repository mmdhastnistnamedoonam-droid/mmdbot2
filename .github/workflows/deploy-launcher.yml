name: deploy-launcher

# ورکرِ راه‌انداز را روی Cloudflare (پلنِ رایگان) دیپلوی می‌کند.
# با هر تغییر در پوشهٔ launcher خودکار اجرا می‌شود.
on:
  push:
    branches: [main, master]
    paths:
      - "launcher/**"
      - ".github/workflows/deploy-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: launcher
          command: deploy --var GH_REPOSITORY:${{ github.repository }} --var GH_REF:${{ github.event.repository.default_branch }}
      - name: Set GitHub token secret on the worker
        working-directory: launcher
        env:
          GH_PAT: ${{ secrets.LAUNCHER_GH_PAT }}
        run: printf '%s' "$GH_PAT" | npx --yes wrangler@3 secret put GH_PAT
